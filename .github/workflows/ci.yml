name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.41.0

      - run: flutter pub get

      - name: Analyze
        run: flutter analyze --no-fatal-warnings --no-fatal-infos

      - name: Run tests
        run: flutter test

  build-android:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.41.0

      - run: flutter pub get

      - name: Build release APK
        run: flutter build apk --release

      - name: Upload APK to Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          RELEASE_TAG="auto-build-${{ github.run_number }}-$(date +%Y%m%d)"
          gh release view "$RELEASE_TAG" >/dev/null 2>&1 || \
          gh release create "$RELEASE_TAG" --title "AI错题本 自动构建 #${{ github.run_number }}" --notes "自动构建的 Android 版本" --prerelease
          gh release upload "$RELEASE_TAG" build/app/outputs/flutter-apk/app-release.apk --clobber

  build-windows:
    runs-on: windows-latest
    needs: test
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.41.0

      - run: flutter pub get

      - name: Enable Windows desktop support
        run: flutter config --enable-windows-desktop

      - name: Build Windows
        run: flutter build windows --release

      - name: Create ZIP archive
        run: |
          cd build/windows/runner/Release
          7z a ../../../ai-wrong-notebook-windows.zip *
        shell: cmd

      - name: Upload Windows to Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          RELEASE_TAG="auto-build-${{ github.run_number }}-$(date +%Y%m%d)"
          gh release view "$RELEASE_TAG" >/dev/null 2>&1 || \
          gh release create "$RELEASE_TAG" --title "AI错题本 自动构建 #${{ github.run_number }}" --notes "自动构建的 Windows 版本" --prerelease
          gh release upload "$RELEASE_TAG" ai-wrong-notebook-windows.zip --clobber